version: '3.8'

services:
  avanade-servicenow-mcp-server:
    image: avanade/servicenow-mcp-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avanade-servicenow-mcp-server
    ports:
      - "3000:3000"
    environment:
      # Single instance mode (legacy .env support)
      - SERVICENOW_INSTANCE_URL=${SERVICENOW_INSTANCE_URL}
      - SERVICENOW_USERNAME=${SERVICENOW_USERNAME}
      - SERVICENOW_PASSWORD=${SERVICENOW_PASSWORD}
      - SERVICENOW_AUTH_TYPE=${SERVICENOW_AUTH_TYPE:-basic}

      # Multi-instance mode (specify instance name)
      - SERVICENOW_INSTANCE=${SERVICENOW_INSTANCE}

      # SSE Configuration
      - SSE_KEEPALIVE_INTERVAL=${SSE_KEEPALIVE_INTERVAL:-15000}

      # API key authentication for /mcp and /instances.
      # Defaults to enforce: the container fails closed unless you opt out.
      - AVANADE_MCP_AUTH_MODE=${AVANADE_MCP_AUTH_MODE:-enforce}
      - AVANADE_MCP_API_KEYS_FILE=${AVANADE_MCP_API_KEYS_FILE:-}
    volumes:
      # Mount config file for multi-instance support
      - ./config/servicenow-instances.json:/app/config/servicenow-instances.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
