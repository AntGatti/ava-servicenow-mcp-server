name: Deploy Original ServiceNow MCP

# Deploys to the original app app-servicenow-mcp-itn-linux-0018 (rg-servicenow-mcp-itn-01)
# from main, only when server code changes. The AVA app has its own workflow:
# deploy-ava-servicenow-mcp.yml.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  APP_NAME: app-servicenow-mcp-itn-linux-0018
  NODE_VERSION: '22'

permissions:
  contents: read

concurrency:
  group: deploy-original-servicenow-mcp
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Frozen contract
        run: npm run contract:verify

      - name: Wire surface smoke test
        run: npm run smoke:tools

      # Ship only what runs in production. Oryx installs dependencies on the app.
      - name: Package
        run: zip -qr release.zip src package.json package-lock.json LICENSE

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip

      - name: Verify health
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://${APP_NAME}.azurewebsites.net/health" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "App did not become healthy" >&2
          exit 1
